<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="author" content="@blau_mark">
<title>Дедлайны ИТМО</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f14; color: #eaeaea;
    min-height: 100vh; overflow-x: hidden;
    display: flex; justify-content: center;
    zoom: 1.1;
  }

  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }

  #app {
    display: flex; width: 100%; max-width: 1100px;
    transition: transform 0.35s ease;
    position: relative;
  }
  #app.shifted { transform: translateX(-80px); }

  #calendar-col {
    flex: 1; padding: 16px;
    max-width: 500px; margin: 0 auto;
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 0; margin-bottom: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sig { font-size: 11px; color: #6c6c78; margin-top: 2px; }
  header .logo {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #4a90e2, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }

  .month-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding: 0 4px;
  }
  .month-nav button {
    background: #1c1c24; border: 1px solid #2a2a34;
    color: #eaeaea; width: 36px; height: 36px;
    border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .month-nav button:hover { background: #252530; }
  .month-nav .title { font-size: 16px; font-weight: 600; }

  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 8px;
  }
  .weekdays div {
    text-align: center; font-size: 11px; color: #6c6c78;
    padding: 4px 0; text-transform: uppercase;
  }

  .days {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 20px;
  }
  .day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer;
    font-size: 14px; position: relative;
    background: #16161d;
    transition: background 0.15s, opacity 0.15s, border-color 0.15s;
    border: 1.5px solid transparent;
  }
  .day:hover { background: #1f1f28; }
  .day.empty { background: transparent; cursor: default; border: none; }
  .day.past { opacity: 0.35; }
  .day.today { border-color: #5a5a66; }
  .day.selected { border-color: #4a90e2; }
  .day.has-tasks { background: #1a1a24; }

  .day .dots {
    position: absolute; bottom: 3px;
    left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: row;
    gap: 2px;
  }
  .day .dots .dot {
    width: 5px; height: 5px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.p1 { background: #e74c3c; }
  .dot.p2 { background: #f1c40f; }
  .dot.p3 { background: #4a90e2; }

  .day .num { z-index: 1; }

  .tasks-title {
    font-size: 14px; color: #8a8a96; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tasks-title button {
    background: #4a90e2; border: none; color: #fff;
    padding: 6px 12px; border-radius: 8px; font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tasks-title button:hover:not(:disabled) { background: #5a9ff2; }
  .tasks-title button:disabled {
    background: #2a2a34; color: #6c6c78; cursor: not-allowed;
  }

  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task {
    background: #1c1c24; border-radius: 12px; padding: 14px;
    border-left: 3px solid #4a90e2;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .task.p1 { border-left-color: #e74c3c; }
  .task.p2 { border-left-color: #f1c40f; }
  .task.p3 { border-left-color: #4a90e2; }
  .task:hover { background: #22222c; }
  .task .info { flex: 1; min-width: 0; }
  .task .name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task .pdf-badge {
    display: inline-block;
    font-size: 10px; color: #e74c3c;
    border: 1px solid #e74c3c;
    border-radius: 4px;
    padding: 0 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .task .del {
    background: none; border: none; color: #6c6c78;
    font-size: 20px; cursor: pointer; padding: 0 6px;
    flex-shrink: 0;
  }
  .task .del:hover { color: #e74c3c; }

  .footer {
    text-align: center; font-size: 11px;
    color: #4a4a55; padding: 24px 0 8px;
  }

  /* ===== ПАНЕЛЬ ===== */
  #detail-panel {
    position: fixed; top: 0; right: 0;
    width: 340px; height: 100vh;
    background: #16161d;
    border-left: 1px solid #2a2a34;
    padding: 20px;
    transform: translateX(100%);
    transition: transform 0.35s ease;
    overflow-y: auto;
    z-index: 50;
  }
  #detail-panel.open { transform: translateX(0); }

  #detail-panel .close {
    background: none; border: none; color: #6c6c78;
    font-size: 24px; cursor: pointer; float: right;
    padding: 0 6px;
    margin: -6px -6px 0 0;
  }
  #detail-panel .close:hover { color: #eaeaea; }

  #detail-panel h2 {
    font-size: 18px; font-weight: 600; margin-bottom: 12px;
    padding-right: 30px;
  }

  .detail-name {
    font-size: 16px; font-weight: 600; margin-bottom: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .links-list {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 8px;
  }
  .link-item {
    color: #4a90e2; text-decoration: none;
    font-size: 14px; padding: 6px 0;
    word-break: break-all;
    cursor: pointer;
  }
  .link-item:hover { text-decoration: underline; }
  .link-num {
    color: #6c6c78; margin-right: 6px;
  }

  /* PDF-блок в панели */
  .pdf-block {
    margin-top: 16px;
    padding: 12px;
    background: #1c1c24;
    border-radius: 10px;
    border: 1px solid #2a2a34;
  }
  .pdf-block .pdf-title {
    font-size: 12px; color: #8a8a96; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .pdf-block .pdf-name {
    font-size: 14px; color: #eaeaea;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .pdf-block .pdf-size {
    font-size: 11px; color: #6c6c78;
    margin-bottom: 10px;
  }
  .pdf-block .pdf-actions {
    display: flex; gap: 6px;
  }
  .pdf-block .pdf-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    border: none;
  }
  .pdf-block .pdf-actions .open { background: #4a90e2; color: #fff; }
  .pdf-block .pdf-actions .open:hover { background: #5a9ff2; }
  .pdf-block .pdf-actions .remove { background: #3a1515; color: #e74c3c; }
  .pdf-block .pdf-actions .remove:hover { background: #4a1a1a; }

  .panel-actions {
    display: flex; gap: 8px; margin-top: 20px;
  }
  .panel-actions button {
    flex: 1; padding: 10px; border-radius: 10px;
    font-size: 14px; cursor: pointer; font-family: inherit;
    border: none; transition: background 0.15s;
  }
  .panel-actions .edit { background: #4a90e2; color: #fff; }
  .panel-actions .edit:hover { background: #5a9ff2; }
  .panel-actions .delete { background: #3a1515; color: #e74c3c; }
  .panel-actions .delete:hover { background: #4a1a1a; }

  .hint {
    font-size: 11px;
    color: #4a4a55;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #22222c;
    text-align: center;
  }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #1c1c24; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; font-size: 16px; }
  .modal label {
    font-size: 12px; color: #8a8a96;
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px; margin-top: 8px;
  }
  .modal label .counter {
    font-size: 11px; color: #4a4a55;
    font-variant-numeric: tabular-nums;
  }
  .modal label .counter.over { color: #e74c3c; }

  .modal input, .modal textarea {
    width: 100%; padding: 10px 12px;
    background: #0f0f14; border: 1px solid #2a2a34;
    color: #eaeaea; border-radius: 10px; font-size: 14px;
    font-family: inherit;
  }
  .modal textarea {
    min-height: 90px;
    max-height: 300px;
    overflow-y: auto;
    line-height: 1.6;
    resize: none;
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: #4a90e2; }
  .modal input.invalid, .modal textarea.invalid { border-color: #e74c3c; }

  .field-error {
    font-size: 11px; color: #e74c3c;
    margin-top: 4px;
    min-height: 13px;
  }

  .prio-row { display: flex; gap: 6px; margin-top: 6px; }
  .prio-btn {
    flex: 1; padding: 8px 4px; border-radius: 10px;
    background: #0f0f14; border: 1px solid #2a2a34;
    color: #8a8a96; font-size: 13px; cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .prio-btn:hover { background: #1a1a24; }
  .prio-btn.active { color: #eaeaea; }
  .prio-btn.active[data-p="1"] { border-color: #e74c3c; background: #3a1515; }
  .prio-btn.active[data-p="2"] { border-color: #f1c40f; background: #3a3115; }
  .prio-btn.active[data-p="3"] { border-color: #4a90e2; background: #1a2a40; }
  .prio-dot { width: 8px; height: 8px; border-radius: 50%; }
  .prio-dot.p1 { background: #e74c3c; }
  .prio-dot.p2 { background: #f1c40f; }
  .prio-dot.p3 { background: #4a90e2; }

  /* PDF-загрузка в модалке */
  .pdf-input-wrap {
    margin-top: 6px;
    border: 1.5px dashed #2a2a34;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .pdf-input-wrap:hover { border-color: #4a90e2; background: #1a1a24; }
  .pdf-input-wrap.has-file { border-style: solid; border-color: #4a90e2; background: #1a2a40; }
  .pdf-input-wrap .pdf-hint {
    font-size: 12px; color: #8a8a96;
  }
  .pdf-input-wrap .pdf-hint strong { color: #4a90e2; }
  .pdf-input-wrap input[type="file"] { display: none; }
  .pdf-current {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-top: 8px;
  }
  .pdf-current .info { flex: 1; min-width: 0; }
  .pdf-current .name {
    font-size: 13px; color: #eaeaea;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pdf-current .size { font-size: 11px; color: #6c6c78; }
  .pdf-current .remove-btn {
    background: none; border: none; color: #e74c3c;
    font-size: 18px; cursor: pointer; padding: 0 4px;
  }

  .modal .actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal .actions button {
    flex: 1; padding: 10px; border-radius: 10px;
    font-size: 14px; cursor: pointer; font-family: inherit;
    border: none;
  }
  .modal .actions .cancel { background: #2a2a34; color: #eaeaea; }
  .modal .actions .save { background: #4a90e2; color: #fff; }
  .modal .actions .save:disabled { background: #2a2a34; color: #6c6c78; cursor: not-allowed; }

  @media (max-width: 1200px) {
    body { zoom: 1; }
    #app.shifted { transform: translateY(-55vh); }
    #detail-panel {
      top: auto; bottom: 0; right: 0; left: 0;
      width: 100%; height: 50vh;
      border-left: none; border-top: 1px solid #2a2a34;
      border-radius: 20px 20px 0 0;
      transform: translateY(100%);
    }
    #detail-panel.open { transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app">
  <div id="calendar-col">
    <header>
      <div>
        <h1>Дедлайны ИТМО</h1>
        <div class="sig">by @blau_mark</div>
      </div>
      <div class="logo">ИТ</div>
    </header>

    <div class="month-nav">
      <button id="prev">◀</button>
      <div class="title" id="month-title">—</div>
      <button id="next">▶</button>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="days" id="days"></div>

    <div class="tasks-title">
      <span id="selected-date">Выбери день</span>
      <button id="add-btn">+ Добавить</button>
    </div>

    <div class="tasks" id="tasks"></div>

    <div class="footer">© 2026 · @blau_mark</div>
  </div>
</div>

<div id="detail-panel">
  <button class="close" id="close-panel">×</button>
  <div id="panel-content"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <h3 id="modal-title">Новый дедлайн</h3>

    <label>
      <span>Предмет</span>
      <span class="counter" id="cnt-subject">0/80</span>
    </label>
    <input id="in-subject" maxlength="80" placeholder="Дискретная математика">
    <div class="field-error" id="err-subject"></div>

    <label>
      <span>Задание</span>
      <span class="counter" id="cnt-name">0/2000</span>
    </label>
    <textarea id="in-name" maxlength="2000" placeholder="Лаба №3"></textarea>
    <div class="field-error" id="err-name"></div>

    <label>
      <span>Ссылки (по одной на строку)</span>
      <span class="counter" id="cnt-links">0/3000</span>
    </label>
    <textarea id="in-links" maxlength="3000" placeholder="https://disk.yandex.ru/xxx"></textarea>
    <div class="field-error" id="err-links"></div>

    <label style="margin-top:12px;">Приоритет</label>
    <div class="prio-row" id="prio-row">
      <button type="button" class="prio-btn active" data-p="3">
        <span class="prio-dot p3"></span>Обычный
      </button>
      <button type="button" class="prio-btn" data-p="2">
        <span class="prio-dot p2"></span>Важно
      </button>
      <button type="button" class="prio-btn" data-p="1">
        <span class="prio-dot p1"></span>Горит
      </button>
    </div>

    <label style="margin-top:12px;">PDF-файл (необязательно)</label>
    <div class="pdf-input-wrap" id="pdf-wrap">
      <div class="pdf-hint" id="pdf-hint">
        <strong>Нажми</strong> или перетащи PDF сюда<br>
        <span style="font-size:10px;">макс. 3 МБ</span>
      </div>
      <input type="file" id="in-pdf" accept="application/pdf,.pdf">
    </div>
    <div class="field-error" id="err-pdf"></div>

    <div class="actions">
      <button class="cancel" id="cancel">Отмена</button>
      <button class="save" id="save">Сохранить</button>
    </div>
  </div>
</div>

<script>
  'use strict';

  // ===== Константы =====
  const STORAGE_KEY = 'itmo_deadlines_v3';
  const ALLOWED_PROTOCOLS = ['http:', 'https:'];
  const LIMITS = {
    subject: 80,
    name: 2000,
    linkName: 100,
    linkUrl: 500,
    linksRaw: 3000,
    pdfBytes: 3 * 1024 * 1024   // 3 МБ
  };

  // ===== Хранилище =====
  let deadlines = loadDeadlines();

  function loadDeadlines() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(x => x && typeof x === 'object')
        .map(x => ({
          id: typeof x.id === 'string' ? x.id : uid(),
          date: String(x.date || ''),
          subject: clampStr(x.subject, LIMITS.subject),
          name: clampStr(x.name, LIMITS.name),
          links: Array.isArray(x.links)
            ? x.links.map(normalizeLink).filter(Boolean)
            : [],
          priority: [1, 2, 3].includes(x.priority) ? x.priority : 3,
          pdf: normalizePdf(x.pdf)
        }))
        .filter(x => x.date);
    } catch {
      return [];
    }
  }

  function normalizePdf(p) {
    if (!p || typeof p !== 'object') return null;
    if (typeof p.data !== 'string' || !p.data.startsWith('data:application/pdf')) return null;
    return {
      name: clampStr(p.name, 200) || 'file.pdf',
      size: Number(p.size) || 0,
      data: p.data
    };
  }

  function clampStr(s, max) {
    return String(s == null ? '' : s).slice(0, max);
  }

  function uid() {
    return 'd_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function normalizeLink(l) {
    if (!l || typeof l !== 'object') return null;
    let name = clampStr(l.name, LIMITS.linkName).trim();
    let url = clampStr(l.url, LIMITS.linkUrl).trim();
    if (!name && !url) return null;
    return { name: name || url, url: url || name };
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(deadlines));
      return true;
    } catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
        alert('Хранилище браузера переполнено. Удали лишние PDF или дедлайны.');
      } else {
        alert('Не удалось сохранить: ' + e);
      }
      return false;
    }
  }

  function findById(id) {
    return deadlines.find(x => x.id === id) || null;
  }

  function removeById(id) {
    const i = deadlines.findIndex(x => x.id === id);
    if (i === -1) return false;
    deadlines.splice(i, 1);
    return true;
  }

  // ===== Утилиты =====
  const today = new Date(); today.setHours(0,0,0,0);
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();
  let selectedDate = null;
  let openTaskId = null;
  let selectedPriority = 3;
  let editingId = null;
  let pendingPdf = null;   // { name, size, data } во время редактирования
  let pdfRemoved = false;  // пометили ли текущий PDF на удаление

  const daysEl = document.getElementById('days');
  const monthTitle = document.getElementById('month-title');
  const tasksEl = document.getElementById('tasks');
  const selectedDateEl = document.getElementById('selected-date');
  const addBtn = document.getElementById('add-btn');
  const modalBg = document.getElementById('modal-bg');
  const modalTitle = document.getElementById('modal-title');
  const inSubject = document.getElementById('in-subject');
  const inName = document.getElementById('in-name');
  const inLinks = document.getElementById('in-links');
  const inPdf = document.getElementById('in-pdf');
  const pdfWrap = document.getElementById('pdf-wrap');
  const pdfHint = document.getElementById('pdf-hint');
  const errSubject = document.getElementById('err-subject');
  const errName = document.getElementById('err-name');
  const errLinks = document.getElementById('err-links');
  const errPdf = document.getElementById('err-pdf');
  const cntSubject = document.getElementById('cnt-subject');
  const cntName = document.getElementById('cnt-name');
  const cntLinks = document.getElementById('cnt-links');
  const appEl = document.getElementById('app');
  const panel = document.getElementById('detail-panel');
  const panelContent = document.getElementById('panel-content');
  const prioRow = document.getElementById('prio-row');

  const MONTHS = ['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря'];
  const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  function fmt(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  // ===== Работа с URL =====
  function safeUrl(raw) {
    if (!raw) return null;
    try {
      const u = new URL(raw);
      if (!ALLOWED_PROTOCOLS.includes(u.protocol)) return null;
      return u.href;
    } catch {
      return null;
    }
  }

  function isLikelyUrl(raw) {
    const s = String(raw || '').trim();
    if (!s) return false;
    // должен начинаться с http:// или https://
    return /^https?:\/\//i.test(s);
  }

  function parseLinks(raw) {
    if (!raw) return { links: [], errors: [] };
    const errors = [];
    const links = [];
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let name = '', url = '';

      // [name](url)
      let m = line.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (m) {
        name = m[1].trim();
        url = m[2].trim();
      } else {
        // name | url
        m = line.match(/^(.+?)\s*\|\s*(.+)$/);
        if (m) {
          name = m[1].trim();
          url = m[2].trim();
        } else {
          // просто url
          name = line;
          url = line;
        }
      }

      if (name.length > LIMITS.linkName) {
        errors.push(`Строка ${i+1}: имя ссылки длиннее ${LIMITS.linkName} символов`);
        continue;
      }
      if (url.length > LIMITS.linkUrl) {
        errors.push(`Строка ${i+1}: URL длиннее ${LIMITS.linkUrl} символов`);
        continue;
      }

      const valid = safeUrl(url);
      if (!valid) {
        errors.push(`Строка ${i+1}: невалидная ссылка (нужен http:// или https://)`);
        continue;
      }

      links.push({ name: name || valid, url: valid });
    }
    return { links, errors };
  }

  function linksToString(links) {
    if (!links || links.length === 0) return '';
    return links.map(l => l.name === l.url ? l.url : `[${l.name}](${l.url})`).join('\n');
  }

  function sortByPriority(items) {
    return [...items].sort((a, b) => (a.priority || 3) - (b.priority || 3));
  }

  // ===== Размер файла =====
  function formatBytes(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  // ===== Рендер календаря =====
  function renderCalendar() {
    daysEl.innerHTML = '';
    monthTitle.textContent = `${MONTHS_NOM[currentMonth]} ${currentYear}`;

    const first = new Date(currentYear, currentMonth, 1);
    const startDay = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < startDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'day empty';
      daysEl.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      const dateStr = fmt(currentYear, currentMonth, d);
      const cellDate = new Date(dateStr); cellDate.setHours(0,0,0,0);

      cell.className = 'day';
      if (cellDate < today) cell.classList.add('past');
      if (dateStr === fmt(today.getFullYear(), today.getMonth(), today.getDate())) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');

      const items = deadlines.filter(x => x.date === dateStr);
      if (items.length > 0) cell.classList.add('has-tasks');

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if (items.length > 0) {
        const sorted = sortByPriority(items);
        const dotsCount = Math.min(sorted.length, 5);
        const dots = document.createElement('div');
        dots.className = 'dots';
        for (let i = 0; i < dotsCount; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot p' + (sorted[i].priority || 3);
          dots.appendChild(dot);
        }
        cell.appendChild(dots);
      }

      cell.addEventListener('click', () => {
        selectedDate = dateStr;
        renderCalendar();
        renderTasks();
      });

      daysEl.appendChild(cell);
    }
  }

  // ===== Рендер списка задач =====
  function renderTasks() {
    tasksEl.innerHTML = '';

    if (!selectedDate) {
      selectedDateEl.textContent = 'Выбери день';
      addBtn.disabled = true;
      return;
    }

    const d = new Date(selectedDate);
    const isPast = d < today;
    addBtn.disabled = isPast;
    addBtn.title = isPast ? 'Нельзя добавить в прошедший день' : '';

    selectedDateEl.textContent = `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()}`;

    const items = sortByPriority(deadlines.filter(x => x.date === selectedDate));
    if (items.length === 0) {
      if (openTaskId) closePanel();
      return;
    }

    if (openTaskId) {
      const stillOpen = items.find(x => x.id === openTaskId);
      if (stillOpen) openPanel(stillOpen.id);
      else closePanel();
    }

    items.forEach((item) => {
      const el = document.createElement('div');
      el.className = 'task p' + (item.priority || 3);

      const info = document.createElement('div');
      info.className = 'info';
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = item.subject;

      if (item.pdf) {
        const badge = document.createElement('span');
        badge.className = 'pdf-badge';
        badge.textContent = 'PDF';
        nameEl.appendChild(badge);
      }

      info.appendChild(nameEl);

      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.setAttribute('aria-label', 'Удалить');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm('Удалить этот дедлайн?')) return;
        removeById(item.id);
        save();
        if (openTaskId === item.id) closePanel();
        renderCalendar();
        renderTasks();
      });

      el.appendChild(info);
      el.appendChild(delBtn);

      el.addEventListener('click', () => {
        if (openTaskId === item.id) closePanel();
        else openPanel(item.id);
      });

      tasksEl.appendChild(el);
    });
  }

  // ===== Панель деталей =====
  function openPanel(id) {
    const item = findById(id);
    if (!item) { closePanel(); return; }

    openTaskId = id;
    const d = new Date(item.date);
    const links = item.links || [];

    panelContent.textContent = '';

    const h2 = document.createElement('h2');
    h2.textContent = `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()}`;

    const nameEl = document.createElement('div');
    nameEl.className = 'detail-name';
    nameEl.textContent = item.name;

    panelContent.appendChild(h2);
    panelContent.appendChild(nameEl);

    if (links.length > 0) {
      const list = document.createElement('div');
      list.className = 'links-list';
      links.forEach((l, i) => {
        const href = safeUrl(l.url);
        const a = document.createElement('a');
        a.className = 'link-item';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const num = document.createElement('span');
        num.className = 'link-num';
        num.textContent = `[${i+1}]`;

        if (href) {
          a.href = href;
          a.appendChild(num);
          a.appendChild(document.createTextNode(l.name));
        } else {
          a.appendChild(num);
          a.appendChild(document.createTextNode(l.name + ' (ссылка недоступна)'));
          a.style.color = '#6c6c78';
          a.style.cursor = 'default';
        }
        list.appendChild(a);
      });
      panelContent.appendChild(list);
    }

    // PDF-блок
    if (item.pdf) {
      const block = document.createElement('div');
      block.className = 'pdf-block';

      const title = document.createElement('div');
      title.className = 'pdf-title';
      title.textContent = 'PDF-файл';

      const nm = document.createElement('div');
      nm.className = 'pdf-name';
      nm.textContent = item.pdf.name;

      const sz = document.createElement('div');
      sz.className = 'pdf-size';
      sz.textContent = formatBytes(item.pdf.size);

      const acts = document.createElement('div');
      acts.className = 'pdf-actions';

      const openBtn = document.createElement('button');
      openBtn.className = 'open';
      openBtn.type = 'button';
      openBtn.textContent = 'Открыть';
      openBtn.addEventListener('click', () => openPdf(item.pdf));

      const rmBtn = document.createElement('button');
      rmBtn.className = 'remove';
      rmBtn.type = 'button';
      rmBtn.textContent = 'Убрать';
      rmBtn.addEventListener('click', () => {
        if (!confirm('Удалить PDF из этого дедлайна?')) return;
        item.pdf = null;
        if (save()) {
          renderTasks();
          openPanel(item.id);
        }
      });

      acts.appendChild(openBtn);
      acts.appendChild(rmBtn);

      block.appendChild(title);
      block.appendChild(nm);
      block.appendChild(sz);
      block.appendChild(acts);
      panelContent.appendChild(block);
    }

    const actions = document.createElement('div');
    actions.className = 'panel-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'edit';
    editBtn.type = 'button';
    editBtn.textContent = 'Редактировать';
    editBtn.addEventListener('click', () => openModal(item.id));

    const delBtn = document.createElement('button');
    delBtn.className = 'delete';
    delBtn.type = 'button';
    delBtn.textContent = 'Удалить';
    delBtn.addEventListener('click', () => {
      if (!confirm('Удалить этот дедлайн?')) return;
      removeById(item.id);
      save();
      closePanel();
      renderCalendar();
      renderTasks();
    });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    panelContent.appendChild(actions);

    panel.classList.add('open');
    appEl.classList.add('shifted');
  }

  function closePanel() {
    openTaskId = null;
    panel.classList.remove('open');
    appEl.classList.remove('shifted');
  }

  // ===== Открытие PDF =====
  function openPdf(pdf) {
    try {
      // data:application/pdf;base64,XXXX
      const comma = pdf.data.indexOf(',');
      if (comma === -1) throw new Error('bad data');
      const b64 = pdf.data.slice(comma + 1);
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank');
      // Через минуту освобождаем — этого хватит, чтобы вкладка открылась
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      if (!w) alert('Разреши всплывающие окна, чтобы открыть PDF.');
    } catch (e) {
      alert('Не удалось открыть PDF: ' + e.message);
    }
  }

  // ===== Модальное окно =====
  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 300) + 'px';
  }

  function updateCounter(input, counterEl, max) {
    const len = input.value.length;
    counterEl.textContent = `${len}/${max}`;
    counterEl.classList.toggle('over', len > max);
  }

  inSubject.addEventListener('input', () => {
    // жёсткая обрезка на случай вставки
    if (inSubject.value.length > LIMITS.subject) {
      inSubject.value = inSubject.value.slice(0, LIMITS.subject);
    }
    updateCounter(inSubject, cntSubject, LIMITS.subject);
    errSubject.textContent = '';
    inSubject.classList.remove('invalid');
  });

  inName.addEventListener('input', () => {
    if (inName.value.length > LIMITS.name) {
      inName.value = inName.value.slice(0, LIMITS.name);
    }
    autoGrow(inName);
    updateCounter(inName, cntName, LIMITS.name);
    errName.textContent = '';
    inName.classList.remove('invalid');
  });

  inLinks.addEventListener('input', () => {
    if (inLinks.value.length > LIMITS.linksRaw) {
      inLinks.value = inLinks.value.slice(0, LIMITS.linksRaw);
    }
    autoGrow(inLinks);
    updateCounter(inLinks, cntLinks, LIMITS.linksRaw);
    errLinks.textContent = '';
    inLinks.classList.remove('invalid');
  });

  // ===== Обработка PDF =====
  function renderPdfPreview() {
    // очищаем всё кроме input и hint
    pdfWrap.querySelectorAll('.pdf-current').forEach(el => el.remove());

    if (pendingPdf) {
      pdfWrap.classList.add('has-file');
      pdfHint.style.display = 'none';

      const cur = document.createElement('div');
      cur.className = 'pdf-current';

      const info = document.createElement('div');
      info.className = 'info';
      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = pendingPdf.name;
      const sz = document.createElement('div');
      sz.className = 'size';
      sz.textContent = formatBytes(pendingPdf.size);
      info.appendChild(nm);
      info.appendChild(sz);

      const rm = document.createElement('button');
      rm.className = 'remove-btn';
      rm.type = 'button';
      rm.textContent = '×';
      rm.title = 'Убрать файл';
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        pendingPdf = null;
        pdfRemoved = true;
        renderPdfPreview();
      });

      cur.appendChild(info);
      cur.appendChild(rm);
      pdfWrap.appendChild(cur);
    } else {
      pdfWrap.classList.remove('has-file');
      pdfHint.style.display = '';
    }
  }

  function readPdfFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        return reject(new Error('Можно прикреплять только PDF-файлы'));
      }
      if (file.size > LIMITS.pdfBytes) {
        return reject(new Error(`Файл больше ${formatBytes(LIMITS.pdfBytes)}`));
      }
      const reader = new FileReader();
      reader.onload = () => resolve({
        name: clampStr(file.name, 200),
        size: file.size,
        data: reader.result   // data:application/pdf;base64,...
      });
      reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
      reader.readAsDataURL(file);
    });
  }

  // клик по зоне — открывает системный диалог
  pdfWrap.addEventListener('click', () => inPdf.click());

  // drag & drop
  pdfWrap.addEventListener('dragover', (e) => {
    e.preventDefault();
    pdfWrap.style.borderColor = '#4a90e2';
  });
  pdfWrap.addEventListener('dragleave', () => {
    pdfWrap.style.borderColor = '';
  });
  pdfWrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    pdfWrap.style.borderColor = '';
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    try {
      pendingPdf = await readPdfFile(file);
      pdfRemoved = false;
      errPdf.textContent = '';
      renderPdfPreview();
    } catch (err) {
      errPdf.textContent = err.message;
    }
  });

  inPdf.addEventListener('change', async () => {
    const file = inPdf.files && inPdf.files[0];
    if (!file) return;
    try {
      pendingPdf = await readPdfFile(file);
      pdfRemoved = false;
      errPdf.textContent = '';
      renderPdfPreview();
    } catch (err) {
      errPdf.textContent = err.message;
    }
    inPdf.value = '';   // чтобы можно было выбрать тот же файл снова
  });

  // ===== Сброс/открытие модалки =====
  function resetModal() {
    inSubject.value = '';
    inName.value = '';
    inLinks.value = '';
    inName.style.height = '';
    inLinks.style.height = '';
    selectedPriority = 3;
    prioRow.querySelectorAll('.prio-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.p === '3');
    });
    pendingPdf = null;
    pdfRemoved = false;
    renderPdfPreview();
    errSubject.textContent = '';
    errName.textContent = '';
    errLinks.textContent = '';
    errPdf.textContent = '';
    inSubject.classList.remove('invalid');
    inName.classList.remove('invalid');
    inLinks.classList.remove('invalid');
    updateCounter(inSubject, cntSubject, LIMITS.subject);
    updateCounter(inName, cntName, LIMITS.name);
    updateCounter(inLinks, cntLinks, LIMITS.linksRaw);
  }

  function openModal(id) {
    if (id) {
      const item = findById(id);
      if (!item) return;
      editingId = id;
      modalTitle.textContent = 'Редактировать дедлайн';
      inSubject.value = item.subject || '';
      inName.value = item.name || '';
      inLinks.value = linksToString(item.links);
      selectedPriority = item.priority || 3;
      prioRow.querySelectorAll('.prio-btn').forEach(b => {
        b.classList.toggle('active', +b.dataset.p === selectedPriority);
      });
      pendingPdf = item.pdf ? { ...item.pdf } : null;
      pdfRemoved = false;
      renderPdfPreview();
      errSubject.textContent = '';
      errName.textContent = '';
      errLinks.textContent = '';
      errPdf.textContent = '';
      updateCounter(inSubject, cntSubject, LIMITS.subject);
      updateCounter(inName, cntName, LIMITS.name);
      updateCounter(inLinks, cntLinks, LIMITS.linksRaw);
      setTimeout(() => {
        autoGrow(inName);
        autoGrow(inLinks);
      }, 0);
    } else {
      editingId = null;
      modalTitle.textContent = 'Новый дедлайн';
      resetModal();
    }
    modalBg.classList.add('open');
    inSubject.focus();
  }

  function closeModal() {
    modalBg.classList.remove('open');
    editingId = null;
    pendingPdf = null;
    pdfRemoved = false;
  }

  prioRow.addEventListener('click', e => {
    const btn = e.target.closest('.prio-btn');
    if (!btn) return;
    prioRow.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPriority = +btn.dataset.p;
  });

  // ===== Навигация =====
  document.getElementById('prev').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });
  document.getElementById('next').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  addBtn.addEventListener('click', () => {
    if (!selectedDate) { alert('Сначала выбери день в календаре'); return; }
    if (addBtn.disabled) return;
    openModal(null);
  });

  document.getElementById('cancel').addEventListener('click', closeModal);

  modalBg.addEventListener('mousedown', (e) => {
    if (e.target === modalBg) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (modalBg.classList.contains('open')) closeModal();
    else if (openTaskId) closePanel();
  });

  // ===== Сохранение =====
  document.getElementById('save').addEventListener('click', () => {
    let ok = true;

    const subject = inSubject.value.trim();
    const name = inName.value.trim();

    if (!subject) {
      errSubject.textContent = 'Укажи предмет';
      inSubject.classList.add('invalid');
      ok = false;
    }
    if (subject.length > LIMITS.subject) {
      errSubject.textContent = `Максимум ${LIMITS.subject} символов`;
      inSubject.classList.add('invalid');
      ok = false;
    }
    if (!name) {
      errName.textContent = 'Опиши задание';
      inName.classList.add('invalid');
      ok = false;
    }
    if (name.length > LIMITS.name) {
      errName.textContent = `Максимум ${LIMITS.name} символов`;
      inName.classList.add('invalid');
      ok = false;
    }

    const { links, errors } = parseLinks(inLinks.value);
    if (errors.length > 0) {
      errLinks.textContent = errors[0] + (errors.length > 1 ? ` (и ещё ${errors.length - 1})` : '');
      inLinks.classList.add('invalid');
      ok = false;
    }

    if (!ok) return;

    // PDF: pendingPdf — то, что сейчас выбрано; pdfRemoved — пометка на удаление
    let finalPdf = null;
    if (pendingPdf) finalPdf = pendingPdf;
    else if (editingId && pdfRemoved) finalPdf = null;
    else if (editingId) {
      const cur = findById(editingId);
      finalPdf = cur ? cur.pdf : null;
    }

    if (editingId) {
      const item = findById(editingId);
      if (item) {
        item.subject = subject;
        item.name = name;
        item.links = links;
        item.priority = selectedPriority;
        item.pdf = finalPdf;
      }
    } else {
      deadlines.push({
        id: uid(),
        date: selectedDate,
        subject, name, links,
        priority: selectedPriority,
        pdf: finalPdf
      });
    }

    if (!save()) return;   // если переполнено — не закрываем, чтобы юзер убрал PDF
    closeModal();
    renderCalendar();
    renderTasks();
    if (openTaskId) openPanel(openTaskId);
  });

  document.getElementById('close-panel').addEventListener('click', closePanel);

  // ===== Инициализация =====
  selectedDate = fmt(today.getFullYear(), today.getMonth(), today.getDate());
  renderCalendar();
  renderTasks();
  resetModal();
</script>
</body>
</html>
